<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
<title>Plan of the Ghanshyam plant (illustration)</title>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#15222C" stroke-opacity=".05"/></pattern>
  <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F9F8"/><stop offset="1" stop-color="#D5DCD9"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CFE3E1"/><stop offset="1" stop-color="#A9C9C7"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15222C" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="800" fill="#E8ECE8"/>
<rect width="1200" height="800" fill="url(#grid)"/>
<!-- green belt (Ghanshyam Farm House) -->
<g fill="#3F6B2E" opacity=".28">
  <circle cx="30" cy="40" r="16"/><circle cx="70" cy="30" r="12"/><circle cx="110" cy="44" r="15"/><circle cx="34" cy="560" r="14"/><circle cx="28" cy="610" r="18"/><circle cx="60" cy="660" r="13"/><circle cx="40" cy="720" r="16"/><circle cx="90" cy="760" r="14"/><circle cx="150" cy="770" r="12"/>
  <circle cx="1170" cy="40" r="15"/><circle cx="1130" cy="30" r="12"/><circle cx="1176" cy="120" r="14"/><circle cx="1160" cy="200" r="12"/><circle cx="560" cy="770" r="13"/><circle cx="610" cy="780" r="16"/><circle cx="660" cy="772" r="12"/><circle cx="420" cy="30" r="12"/><circle cx="470" cy="24" r="15"/><circle cx="520" cy="36" r="11"/>
</g>
<!-- haul road and main road -->
<path d="M240 300 C320 360 360 380 400 400 M520 430 C600 520 700 600 800 640 L1200 650" fill="none" stroke="#D3CBB8" stroke-width="26" stroke-linecap="round"/>
<path d="M240 300 C320 360 360 380 400 400 M520 430 C600 520 700 600 800 640 L1200 650" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="14 12" opacity=".8"/>
<!-- quarry terraces -->
<g stroke="#15222C" stroke-opacity=".12" stroke-width="1.5">
  <path d="M40 240C40 120 140 80 210 92S330 160 320 250 250 380 170 372 40 330 40 240Z" fill="#E4DCCB"/>
  <path d="M68 240C70 145 150 112 208 122S300 178 292 250 238 350 172 344 66 312 68 240Z" fill="#EEE8DB"/>
  <path d="M96 240C98 168 160 142 206 150S272 196 266 250 226 322 176 318 94 292 96 240Z" fill="#F4F1EA"/>
  <path d="M124 240C126 192 170 172 204 178S246 212 242 250 214 294 180 292 122 274 124 240Z" fill="#FAF9F5"/>
  <path d="M152 240C154 214 178 202 200 206S220 228 218 248 202 268 184 268 150 258 152 240Z" fill="#FFFFFF"/>
</g>
<!-- settling ponds (water recycling) -->
<rect x="250" y="520" width="150" height="80" rx="18" fill="url(#water)" stroke="#0B6C70" stroke-opacity=".25"/>
<rect x="420" y="530" width="110" height="70" rx="16" fill="url(#water)" stroke="#0B6C70" stroke-opacity=".25"/>
<!-- conveyors -->
<g fill="none" stroke="#4A5963" stroke-width="5" stroke-linecap="round" opacity=".55">
  <path d="M530 380 L610 262"/><path d="M680 262 L708 470"/><path d="M748 496 L900 460"/><path d="M432 360 L432 330 L250 300"/>
</g>
<g fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 6" opacity=".9">
  <path d="M530 380 L610 262"/><path d="M680 262 L708 470"/><path d="M748 496 L900 460"/><path d="M432 360 L432 330 L250 300"/>
</g>
<!-- washing lines -->
<g filter="url(#sh)">
  <rect x="340" y="366" width="190" height="34" rx="4" fill="url(#roof)" stroke="#15222C" stroke-opacity=".2"/>
  <rect x="340" y="414" width="190" height="34" rx="4" fill="url(#roof)" stroke="#15222C" stroke-opacity=".2"/>
</g>
<g fill="#FFFFFF" stroke="#0B6C70" stroke-opacity=".5" stroke-width="2">
  <circle cx="362" cy="383" r="8"/><circle cx="386" cy="383" r="8"/><circle cx="410" cy="383" r="8"/><circle cx="362" cy="431" r="8"/><circle cx="386" cy="431" r="8"/><circle cx="410" cy="431" r="8"/>
</g>
<!-- rotary dryer -->
<g transform="rotate(-14 636 240)" filter="url(#sh)">
  <rect x="566" y="222" width="140" height="36" rx="18" fill="url(#roof)" stroke="#15222C" stroke-opacity=".25"/>
  <path d="M590 222v36M614 222v36M638 222v36M662 222v36M686 222v36" stroke="#15222C" stroke-opacity=".12"/>
</g>
<!-- magnetic separation -->
<g filter="url(#sh)"><rect x="672" y="468" width="76" height="56" rx="4" fill="url(#roof)" stroke="#15222C" stroke-opacity=".2"/></g>
<g fill="#355A74" opacity=".55"><circle cx="692" cy="496" r="7"/><circle cx="710" cy="496" r="7"/><circle cx="728" cy="496" r="7"/></g>
<!-- lab -->
<g filter="url(#sh)"><rect x="850" y="168" width="78" height="50" rx="4" fill="url(#roof)" stroke="#15222C" stroke-opacity=".2"/></g>
<rect x="850" y="168" width="78" height="10" rx="3" fill="#0B6C70" opacity=".75"/>
<!-- covered storage sheds -->
<g filter="url(#sh)">
  <rect x="880" y="400" width="140" height="34" rx="3" fill="url(#roof)" stroke="#15222C" stroke-opacity=".2"/>
  <rect x="880" y="442" width="140" height="34" rx="3" fill="url(#roof)" stroke="#15222C" stroke-opacity=".2"/>
  <rect x="880" y="484" width="140" height="34" rx="3" fill="url(#roof)" stroke="#15222C" stroke-opacity=".2"/>
</g>
<path d="M880 417h140M880 459h140M880 501h140" stroke="#15222C" stroke-opacity=".14"/>
<!-- dispatch yard, weighbridges and trucks -->
<rect x="960" y="600" width="200" height="130" rx="10" fill="#DCE1DE" stroke="#15222C" stroke-opacity=".12"/>
<rect x="985" y="618" width="60" height="16" rx="2" fill="#4A5963" opacity=".35"/><rect x="985" y="646" width="60" height="16" rx="2" fill="#4A5963" opacity=".35"/>
<g fill="#15222C" opacity=".55">
  <rect x="1070" y="618" width="34" height="14" rx="2"/><rect x="1070" y="640" width="34" height="14" rx="2"/><rect x="1070" y="662" width="34" height="14" rx="2"/><rect x="1115" y="618" width="34" height="14" rx="2"/><rect x="1115" y="640" width="34" height="14" rx="2"/><rect x="985" y="690" width="34" height="14" rx="2"/><rect x="1030" y="690" width="34" height="14" rx="2"/>
</g>
<!-- north arrow and scale -->
<g transform="translate(1110 90)" fill="#15222C" opacity=".6"><path d="M0 -26 L9 6 L0 0 L-9 6Z"/><text y="28" text-anchor="middle" font-family="Menlo, ui-monospace, monospace" font-size="15">N</text></g>
<g transform="translate(60 120)" opacity=".55"><path d="M0 0h120M0 -6v12M60 -4v8M120 -6v12" stroke="#15222C" stroke-width="2" fill="none"/><text x="0" y="-12" font-family="Menlo, ui-monospace, monospace" font-size="13" fill="#15222C">0</text><text x="104" y="-12" font-family="Menlo, ui-monospace, monospace" font-size="13" fill="#15222C">200 m</text></g>
</svg>
