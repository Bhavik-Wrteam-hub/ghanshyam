<!doctype html>
<!--
  ============================================================================
  GHANSHYAM GROUP website: THE HOMEPAGE (the group itself)
  ============================================================================
  TO CHANGE ANY WORDS, NUMBERS, CONTACT DETAILS OR IMAGES:
      edit  site-content.js  (next to this file). Nothing else is needed.

  Values wrapped in S( ... ) in that file are TEMPORARY SAMPLE DATA.
  Open any page with  ?review  at the end of its address to see each one
  outlined in orange.

  The site's pages:
      index.html          GHANSHYAM GROUP (this page)
      silica-sand.html    Ghanshyam Silica Sand
      kaolin.html         Ghanshyam Kaolin
      minerals.html       Ghanshyam Minerals
      processors.html     Ghanshyam Processors
      farm-house.html     Ghanshyam Farm House

  This file only holds the page structure. Each <section> below is filled in
  by its own script in assets/js/sections/ and styled in assets/css/sections/.
  The first screen is the five branch films (film.js, film.css, and
  core/branch-player.js, which decides what loads and plays). The homepage's own
  sections (businesses, products, applications, strength, values, presence)
  are in home.js and home.css. The brand system (colours, fonts, spacing,
  motion) lives in assets/css/tokens.css. See README.md for the full guide.
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Keep the title and description in sync with "meta" in site-content.js -->
  <title>GHANSHYAM GROUP | Silica sand, kaolin, minerals and farm produce from Kutch, Gujarat</title>
  <meta name="description" content="A family-run industrial group from Kutch, Gujarat. Five companies: Ghanshyam Silica Sand, Kaolin, Minerals, Processors and Farm House.">
  <meta name="theme-color" content="#F2F1EC">
  <link rel="icon" type="image/svg+xml" href="assets/img/brand/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <!-- Link previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="GHANSHYAM GROUP | Five companies. One ground.">
  <meta property="og:description" content="Silica sand, kaolin, minerals, fine powders and farm produce from Kutch, Gujarat.">
  <!-- DEPLOY STEP: replace with absolute live URLs once the site has its address -->
  <meta property="og:url" content="https://example.com/">
  <meta property="og:image" content="https://example.com/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The GHANSHYAM GROUP logo beside photos of its five companies: silica sand, kaolin, minerals, a grinding plant and a farm">
  <meta name="twitter:card" content="summary_large_image">

  <!-- The first picture on screen: the first branch film's poster, wide or tall -->
  <link rel="preload" as="image" type="image/webp" href="assets/video/branches/silica.webp" media="(orientation: landscape)" fetchpriority="high">
  <link rel="preload" as="image" type="image/webp" href="assets/video/branches/silica-tall.webp" media="(orientation: portrait)" fetchpriority="high">

  <!-- Fonts: Montserrat (the logo's typeface: headlines and logo labels), Hanken Grotesk (body), IBM Plex Mono (spec labels). Only the weights in use. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

  <script>
    document.documentElement.classList.add('js');
    /* Safety net: show the page even if a script fails to load. */
    setTimeout(function () { document.body && document.body.classList.add('is-ready'); }, 3000);
  </script>

  <!-- Brand system, then shared pieces, then one file per section -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/logo.css">
  <link rel="stylesheet" href="assets/css/sections/nav.css">
  <link rel="stylesheet" href="assets/css/sections/film.css">
  <link rel="stylesheet" href="assets/css/sections/home.css">

  <link rel="stylesheet" href="assets/css/sections/contact.css">
  <link rel="stylesheet" href="assets/css/sections/footer.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="env" aria-hidden="true"></div>

  <header class="site-header" data-section="nav"></header>

  <main id="main" tabindex="-1">
    <section id="top" class="film" data-section="film" aria-labelledby="film-title"></section>
    <section id="about" class="section about" data-section="about" aria-labelledby="about-title"></section>
    <section id="businesses" class="section businesses section--panel" data-section="businesses" aria-labelledby="businesses-title"></section>

    <section id="leadership" class="section leadership" data-section="leadership" aria-labelledby="leadership-title"></section>
    <section id="presence" class="section presence section--panel" data-section="presence" aria-labelledby="presence-title"></section>

  <footer class="site-footer on-dark" data-section="footer"></footer>
  <dialog id="privacy" class="privacy" data-section="privacy" aria-labelledby="privacy-title"></dialog>

  <noscript>

      <strong>GHANSHYAM GROUP</strong>. This site needs JavaScript to show its content.
      Please enable it, or contact us directly.
    </div>
  </noscript>

  <!-- Motion (animation library), pinned version, loaded without blocking the page -->
  <script async src="https://cdn.jsdelivr.net/npm/motion@14.9.1/dist/motion.js"
          integrity="sha384-Tf4POONnr0PkHnugSMSt0Br0cyoxZ1pxYEZsoniM1ufOGlDNIRGB3E9DnzgdXZvE"
          crossorigin="anonymous"
          onload="window.GG && GG.onMotionLoaded && GG.onMotionLoaded()"></script>

  <!-- Content first, then helpers, then one script per section, then start -->
  <script defer src="site-content.js"></script>
  <script defer src="assets/js/core/utils.js"></script>
  <script defer src="assets/js/core/icons.js"></script>
